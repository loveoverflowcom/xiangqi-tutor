name: Foundation checks

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check_skills.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_links.py
      - run: git diff --check

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p xqt -- validate knowledge/examples
      - name: Export index plan and assert honest status
        run: |
          mkdir -p build
          cargo run --quiet --locked -p xqt -- index-plan knowledge/examples --public > build/index-plan.json
          python3 - <<'PY'
          import json
          p = json.load(open('build/index-plan.json'))
          assert p['embedding_status'] == 'not_embedded'
          assert len(p['chunks']) == 1
          assert len(p['excluded']) == 1
          assert p['chunks'][0]['verification'] == 'editorial_metadata_only'
          PY
      - run: python3 scripts/check_links.py
